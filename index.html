<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="calculator__topline">
      <span class="brand-mark" aria-hidden="true">+</span>
      <span class="brand-name">pocket calc</span>
      <span class="brand-status" aria-label="Ready"></span>
    </div>

    <section class="display" aria-live="polite">
      <div class="display__expression" id="expression">&nbsp;</div>
      <output class="display__value" id="display">0</output>
    </section>

    <section class="keypad" aria-label="Calculator keys">
      <button class="key key--utility" data-action="clear" type="button">AC</button>
      <button class="key key--utility" data-action="backspace" type="button" aria-label="Delete last digit">⌫</button>
      <button class="key key--utility" data-action="percent" type="button">%</button>
      <button class="key key--operator" data-operator="÷" type="button">÷</button>

      <button class="key" data-number="7" type="button">7</button>
      <button class="key" data-number="8" type="button">8</button>
      <button class="key" data-number="9" type="button">9</button>
      <button class="key key--operator" data-operator="×" type="button">×</button>

      <button class="key" data-number="4" type="button">4</button>
      <button class="key" data-number="5" type="button">5</button>
      <button class="key" data-number="6" type="button">6</button>
      <button class="key key--operator" data-operator="−" type="button">−</button>

      <button class="key" data-number="1" type="button">1</button>
      <button class="key" data-number="2" type="button">2</button>
      <button class="key" data-number="3" type="button">3</button>
      <button class="key key--operator" data-operator="+" type="button">+</button>

      <button class="key key--wide" data-number="0" type="button">0</button>
      <button class="key" data-action="decimal" type="button">.</button>
      <button class="key key--equals" data-action="calculate" type="button">=</button>
    </section>
    <p class="hint">Keyboard ready <span aria-hidden="true">·</span> esc clears</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
